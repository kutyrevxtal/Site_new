<!doctype html>
<html lang="en" data-theme="orange">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Skydiving | Anton Kutyrev</title>
        <meta name="description" content="Skydiving page for Anton Kutyrev." />
        <link rel="stylesheet" href="./styles.css" />
        <script src="./script.js" defer></script>
    </head>
    <body>
        <div class="site-shell">
            <header class="site-header" data-site-header="hobbies"></header>

            <main>
                <section class="landing-hero rubric-hero">
                    <div class="landing-backdrop">
                        <img
                            src="./assets/images/hobbies/Skydiving/skydiving_1.jpg"
                            alt="Skydiving page image."
                        />
                    </div>
                    <div class="landing-inner">
                        <div class="landing-copy">
                            <p class="eyebrow">Outside research</p>
                            <h1>Skydiving</h1>
                            <p class="hero-text">Blue skies!</p>
                        </div>
                    </div>
                </section>

                <section class="section-block">
                    <div class="photo-essay-grid photo-essay-grid-single">
                        <article class="panel photo-entry">
                            <img
                                src="./assets/images/hobbies/Skydiving/skydiving_1.jpg"
                                alt="Skydiving image."
                                data-lightbox-self
                                data-lightbox-title="Skydiving"
                                data-lightbox-note="Hobbies"
                                loading="lazy"
                            />
                            <div class="photo-entry-copy">
                                <h3>Skydiving</h3>
                                <p>
                                    A separate space for jumps, images, and
                                    short notes beyond the geology pages.
                                </p>
                            </div>
                        </article>
                    </div>
                </section>

                <section class="section-block">
                    <div class="section-heading">
                        <h2>Jumps</h2>
                    </div>
                    <div class="card-grid video-grid video-grid-two">
                        <article class="panel video-card">
                            <iframe
                                class="video-embed"
                                src="https://www.youtube-nocookie.com/embed/84zARw67Yyw?rel=0"
                                title="Anton and Ian Jump 1"
                                loading="lazy"
                                allow="
                                    accelerometer;
                                    autoplay;
                                    clipboard-write;
                                    encrypted-media;
                                    gyroscope;
                                    picture-in-picture;
                                    web-share;
                                "
                                referrerpolicy="strict-origin-when-cross-origin"
                                allowfullscreen
                            ></iframe>
                            <h3>Anton &amp; Ian Jump 1</h3>
                            <a
                                class="text-link"
                                href="https://youtu.be/84zARw67Yyw"
                                target="_blank"
                                rel="noreferrer"
                                >Watch on YouTube</a
                            >
                        </article>
                        <article class="panel video-card">
                            <iframe
                                class="video-embed"
                                src="https://www.youtube-nocookie.com/embed/fMuM_j-VSK8?rel=0"
                                title="Anton and Ian Jump 2"
                                loading="lazy"
                                allow="
                                    accelerometer;
                                    autoplay;
                                    clipboard-write;
                                    encrypted-media;
                                    gyroscope;
                                    picture-in-picture;
                                    web-share;
                                "
                                referrerpolicy="strict-origin-when-cross-origin"
                                allowfullscreen
                            ></iframe>
                            <h3>Anton &amp; Ian Jump 2</h3>
                            <a
                                class="text-link"
                                href="https://youtu.be/fMuM_j-VSK8"
                                target="_blank"
                                rel="noreferrer"
                                >Watch on YouTube</a
                            >
                        </article>
                    </div>
                </section>
            </main>

            <footer
                class="site-footer"
                data-site-footer
                data-site-footer-secondary="Skydiving"
            ></footer>
        </div>
    </body>
</html>
