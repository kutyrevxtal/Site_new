<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Octahedral crystal mark">
  <rect width="32" height="32" rx="7" fill="#121417"/>
  <!-- octahedron: top apex T, bottom apex B, left/right girdle L/R, near girdle vertex F -->
  <!-- four visible faces, shaded to read as facets -->
  <polygon points="16,3 4,16 16,21" fill="#ff9a57" stroke="#121417" stroke-width="0.6" stroke-linejoin="round"/>
  <polygon points="16,3 16,21 28,16" fill="#f47a2c" stroke="#121417" stroke-width="0.6" stroke-linejoin="round"/>
  <polygon points="4,16 16,21 16,29" fill="#c9631f" stroke="#121417" stroke-width="0.6" stroke-linejoin="round"/>
  <polygon points="16,21 28,16 16,29" fill="#a8551b" stroke="#121417" stroke-width="0.6" stroke-linejoin="round"/>
  <!-- hidden back vertex, dashed edges hinting at the full crystal form -->
  <path d="M16,3 L16,11 M16,11 L4,16 M16,11 L28,16" fill="none" stroke="#ffd9b8" stroke-width="0.6" stroke-dasharray="1.4 1.2" opacity="0.8"/>
</svg>
