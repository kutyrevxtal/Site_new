<!doctype html>
<html lang="en" data-theme="orange">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Painting | Anton Kutyrev</title>
        <meta
            name="description"
            content="Painting page for Anton Kutyrev."
        />
        <link rel="stylesheet" href="./styles.css" />
        <script src="./script.js" defer></script>
    </head>
    <body>
        <div class="site-shell">
            <header class="site-header" data-site-header="hobbies"></header>

            <main>
                <section class="landing-hero rubric-hero">
                    <div class="landing-backdrop">
                        <img
                            src="./assets/images/hobbies/Painting/painting-dachshund.jpg"
                            alt="Painting page image."
                        />
                    </div>
                    <div class="landing-inner">
                        <div class="landing-copy">
                            <p class="eyebrow">Outside research</p>
                            <h1>Painting</h1>
                            <p class="hero-text">
                                Paintings, sketches, and notes outside field
                                and laboratory work.
                            </p>
                        </div>
                    </div>
                </section>

                <section class="section-block">
                    <div class="photo-essay-grid photo-essay-grid-single">
                        <article class="panel photo-entry">
                            <img
                                src="./assets/images/hobbies/Painting/painting-dachshund.jpg"
                                alt="Painting image."
                                data-lightbox-self
                                data-lightbox-title="Painting"
                                data-lightbox-note="Hobbies"
                                loading="lazy"
                            />
                            <div class="photo-entry-copy">
                                <h3>Painting</h3>
                                <p>
                                    A place for paintings, sketches, and notes
                                    outside field and laboratory work.
                                </p>
                            </div>
                        </article>
                    </div>
                </section>
            </main>

            <footer
                class="site-footer"
                data-site-footer
                data-site-footer-secondary="Painting"
            ></footer>
        </div>
    </body>
</html>
