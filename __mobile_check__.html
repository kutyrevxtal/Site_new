<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Mobile check</title>
        <style>
            body {
                margin: 0;
                font-family: sans-serif;
            }

            iframe {
                display: block;
                border: 0;
            }

            pre {
                margin: 0;
                padding: 1rem;
                white-space: pre-wrap;
            }
        </style>
    </head>
    <body>
        <iframe id="frame" title="mobile check frame"></iframe>
        <pre id="result">waiting</pre>
        <script>
            const params = new URLSearchParams(window.location.search);
            const path = params.get("path") || "index.html";
            const width = Number(params.get("width") || 320);
            const height = Number(params.get("height") || 2400);
            const frame = document.getElementById("frame");
            const result = document.getElementById("result");

            frame.style.width = `${width}px`;
            frame.style.height = `${height}px`;
            frame.src = path;

            const report = () => {
                const doc = frame.contentDocument;
                const win = frame.contentWindow;

                if (!doc || !win) {
                    result.textContent = JSON.stringify(
                        { path, width, error: "no-frame" },
                        null,
                        2,
                    );
                    return;
                }

                const root = doc.documentElement;
                const body = doc.body;
                const offenders = Array.from(
                    doc.querySelectorAll("body *"),
                )
                    .map((element) => {
                        const rect = element.getBoundingClientRect();
                        return {
                            tag: element.tagName.toLowerCase(),
                            className: element.className || "",
                            text: (element.textContent || "")
                                .trim()
                                .replace(/\s+/g, " ")
                                .slice(0, 80),
                            right: Math.round(rect.right),
                            width: Math.round(rect.width),
                        };
                    })
                    .filter((item) => item.right > root.clientWidth + 1)
                    .slice(0, 12);
                const payload = {
                    path,
                    width,
                    scrollWidth: root.scrollWidth,
                    clientWidth: root.clientWidth,
                    bodyScrollWidth: body ? body.scrollWidth : null,
                    bodyClientWidth: body ? body.clientWidth : null,
                    hasHorizontalOverflow:
                        root.scrollWidth > root.clientWidth ||
                        (body && body.scrollWidth > body.clientWidth),
                    offenders,
                };

                result.textContent = JSON.stringify(payload, null, 2);
            };

            frame.addEventListener("load", () => {
                window.setTimeout(report, 1200);
            });
        </script>
    </body>
</html>
