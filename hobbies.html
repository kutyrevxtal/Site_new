<!doctype html>
<html lang="en" data-theme="orange">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Hobbies | Anton Kutyrev</title>
        <meta

            content="Hobbies and personal interests of Anton Kutyrev."

        <link rel="stylesheet" href="./styles.css" />

    <body>
        <div class="site-shell">
            <header class="site-header" data-site-header="hobbies"></header>

            <main>
                <section class="landing-hero rubric-hero">
                    <div class="landing-backdrop">
                        <img
                            src="./assets/images/hobbies/283B00FD-4854-4713-A1FD-95ECC9CAD305_1_102_a.jpg"
                            alt="Anton Kutyrev in a volcanic mountain landscape."
                        />
                    </div>
                    <div class="landing-inner">
                        <div class="landing-copy">
                            <p class="eyebrow">Outside research</p>
                            <h1>Hobbies</h1>
                            <p class="hero-text">
                                Just something outside geology.
                            </p>
                        </div>
                    </div>
                </section>

                <section class="section-block">
                    <div
                        class="card-grid research-grid research-index-grid research-plates"
                    >
                        <a
                            class="panel feature-card research-index-card research-index-link"
                            href="./painting.html"
                        >
                            <img
                                class="research-index-cover"
                                src="./assets/images/hobbies/painting-dachshund.jpg"
                                alt="Painting panel image."
                                loading="lazy"

                                <h3>Painting</h3>
                                <p>
                                    A place for paintings, sketches, and notes

                                </p>
                            </div>
                        </a>
                        <a
                            class="panel feature-card research-index-card research-index-link"
                            href="./skydiving.html"
                        >
                            <img
                                class="research-index-cover"
                                src="./assets/images/hobbies/skydiving-freefall.png"
                                alt="Skydiving panel image."
                                loading="lazy"
                            />
                            <div class="research-index-copy">
                                <h3>Skydiving</h3>
                                <p>
                                    A separate space for jumps, images, and
                                    short notes beyond the geology pages.
                                </p>
                            </div>
                        </a>
                    </div>
                </section>
            </main>

            <footer
                class="site-footer"
                data-site-footer
                data-site-footer-secondary="Painting | Skydiving"
            ></footer>
