        <div class="site-shell">
            <header class="site-header" data-site-header="photography"></header>

                <section class="landing-hero rubric-hero">
                    <div class="landing-backdrop">
                        <button
                            class="hero-lightbox-trigger"
                            type="button"
                            data-lightbox-src="./assets/images/photography/kazakhstan/burabay-view.jpg"
                            data-lightbox-alt="Granite hills above a lake and dry autumn steppe, Burabay National Park, northern Kazakhstan."

                            data-lightbox-note="Kazakhstan"

                                src="./assets/images/photography/kazakhstan/burabay-view.jpg"
                                alt="Granite hills above a lake and dry autumn steppe, Burabay National Park, northern Kazakhstan."
                            />

                    </div>
                    <div class="landing-inner">
                        <div class="landing-copy">
                            <h1>Kazakhstan</h1>
                            <p class="hero-text">
                                Photos from where I live and work now. More to
                                come.
                            </p>
                        </div>
                    </div>
                </section>

                <section class="section-block">
                    <div class="photo-essay-grid photo-essay-grid-single">
                        <article class="panel photo-entry">
                            <button
                                class="lightbox-trigger"
                                type="button"
                                data-lightbox-src="./assets/images/photography/kazakhstan/burabay-view.jpg"

                                data-lightbox-note="Kazakhstan"

                                    src="./assets/images/photography/kazakhstan/burabay-view.jpg"

                                />
                            </button>
                            <div class="photo-entry-copy">
                                <h3>Burabay</h3>
                                <p>
                                    Granite hills over the lakes of Burabay,
                                    September 2026. The wider Kokchetav Massif
                                    is where diamonds were first found in
                                    ultrahigh-pressure metamorphic rocks.
                                </p>
                                <div class="photo-meta">
                                    <a
                                        class="photo-map-link"
                                        href="https://www.google.com/maps?q=53.142342,70.307236"
                                        target="_blank"
                                        rel="noreferrer"

                                    >
                                </div>
                            </div>
                        </article>
                    </div>
